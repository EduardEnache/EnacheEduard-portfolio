# eduardenache.ro web tier: static dist/ + a GET-only proxy to portfolio-api, one origin.
# Mounted into nginxinc/nginx-unprivileged (see api/docker-compose.yml). nginx/csp.inc is generated by `npm run build:csp`.
server_tokens off;

gzip on; gzip_comp_level 6; gzip_min_length 512; gzip_vary on; gzip_proxied any;
gzip_types application/javascript text/css application/json image/svg+xml text/plain application/xml;

# Real client address. Tailscale Funnel overwrites X-Forwarded-For with the external client's IP and sets
# Tailscale-Funnel-Request: ?1 after stripping any client-sent copy (tailscale ipn/ipnlocal/serve.go). Anything that
# reaches us without that marker (e.g. a local curl) is keyed by its TCP peer, so a forged X-Forwarded-For buys nothing.
map $http_x_forwarded_for $xff_ip { "~^[0-9a-fA-F:.]{3,45}$" $http_x_forwarded_for; default ""; }
map $http_tailscale_funnel_request $client_ip0 { "?1" $xff_ip; default $remote_addr; }

# Cloudflare Tunnel: $cf_ip is CF-Connecting-IP, non-empty only when the TCP peer is the cloudflared container
# (cf.conf is rendered from cf.conf.template with CF_IP). It wins over the Funnel marker, which a visitor could forge via Cloudflare.
include /tmp/cf.conf;
map $cf_ip $client_ip { "" $client_ip0; default $cf_ip; }
log_format real '$client_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

limit_req_zone $client_ip zone=api:1m rate=2r/s;
limit_req_status 429;

# Hashed build output is immutable; HTML always revalidates; the API sets its own Cache-Control.
map $uri $cache_control {
    default            "public, max-age=3600";
    ~^/_astro/         "public, max-age=31536000, immutable";
    ~/$                "no-cache";
    ~\.html$           "no-cache";
    ~^/v1/             "";
    /healthz           "";
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout real;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Every response. No location below declares its own add_header (that would drop these).
    include /etc/nginx/conf.d/csp.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/index.html =404;
    }
    location ~ /\. { return 404; }

    # API: GET/HEAD/OPTIONS only. The API answers its own 405s; nginx only forwards the three methods.
    location /v1/ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /etc/nginx/conf.d/proxy.inc;
    }
}

# www -> apex, path and query kept
server {
    listen 8080;
    server_name www.eduardenache.ro;
    access_log /dev/stdout real;
    return 301 https://eduardenache.ro$request_uri;
}
