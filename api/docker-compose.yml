name: portfolio-api # one stack: the API and the nginx web tier in front of it

services:
  api:
    build: .
    container_name: portfolio-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      CLOUDFLARE_TUNNEL_TOKEN: "" # env_file holds it for compose interpolation only; the API must not see it
    ports:
      - "127.0.0.1:${HOST_PORT:-8506}:8080"
    volumes: # .git dirs only, read-only; the API runs `git rev-list` / `git log` on them
      - ${HOME}/services/oneway/.git:/repos/oneway:ro
      - ${HOME}/archive/faelles-trip-photos/.git:/repos/faelles:ro
      - ${HOME}/archive/copenhagen-pass-maximizer/.git:/repos/copenhagen:ro
      - ${HOME}/archive/bucharest-bitesnvibes.git:/repos/bucuresti:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [prom, casata, minecraft, web]

  web:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    container_name: portfolio-web
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    ports:
      - "127.0.0.1:${WEB_PORT:-8507}:8080"
    volumes: # dist/ and the generated CSP are rebuilt on the host (`npm run deploy:local`)
      - ../dist:/usr/share/nginx/html:ro
      - ../nginx:/etc/nginx/conf.d:ro # a directory, so edits are seen after a restart (default.conf is the only *.conf)
      - ../nginx/cf.conf.template:/etc/nginx/templates/cf.conf.template:ro # CF_IP is filled in at start, output goes to /tmp
    environment:
      CF_IP: ${CF_IP:?set CF_IP in .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      web: { ipv4_address: "${WEB_IP}" }

  # Cloudflare Tunnel: eduardenache.ro + www -> http://web:8080 (hostnames are set in the Cloudflare Zero Trust dashboard).
  # Outbound-only, no ports. Fixed address so nginx trusts CF-Connecting-IP from this peer only.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: portfolio-cloudflared
    profiles: ["tunnel"] # enabled by scripts/cutover.sh (COMPOSE_PROFILES=tunnel in api/.env)
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # compose interpolates even with the profile off, so no :?; cutover.sh checks it
    depends_on: { web: { condition: service_healthy } }
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    networks:
      web: { ipv4_address: "${CF_IP:?set CF_IP in .env}" }

# Existing networks of the three read-only sources (names come from .env).
networks:
  web: # fixed subnet so the API can trust x-real-ip from exactly the web container address
    ipam: { config: [{ subnet: "${WEB_SUBNET}", gateway: "${WEB_GATEWAY}" }] }
  prom: { external: true, name: "${NET_PROMETHEUS}" }
  casata: { external: true, name: "${NET_CASATA}" }
  minecraft: { external: true, name: "${NET_MINECRAFT}" }
